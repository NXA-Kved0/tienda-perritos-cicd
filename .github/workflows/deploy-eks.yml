name: CI/CD Tienda Perritos - EKS

on:
  push:
    branches: [ "main" ]

jobs:

  # ─────────────────────────────────────────
  # JOB 1: Build y Push Frontend a ECR
  # ─────────────────────────────────────────
  build-frontend:
    name: Build y Push Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Normalizar ECR_URL
        run: echo "ECR_URL=$(echo '${{ secrets.ECR_URL }}' | tr '[:upper:]' '[:lower:]' | sed 's:/*$::')" >> $GITHUB_ENV

      - name: Test - Verificar archivos del frontend
        run: |
          test -f frontend/index.html
          test -f frontend/app.js
          test -f frontend/style.css
          test -f frontend/default.conf
          echo "Test OK: archivos estáticos del frontend presentes"

      - name: Build y Push imagen Frontend
        run: |
          docker build -t tienda-frontend ./frontend
          docker tag tienda-frontend:latest $ECR_URL/tienda-frontend:${{ github.sha }}
          docker tag tienda-frontend:latest $ECR_URL/tienda-frontend:latest
          docker push $ECR_URL/tienda-frontend:${{ github.sha }}
          docker push $ECR_URL/tienda-frontend:latest

  # ─────────────────────────────────────────
  # JOB 2: Build y Push Backend a ECR
  # ─────────────────────────────────────────
  build-backend:
    name: Build y Push Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        working-directory: ./backend
        run: npm ci --production=false

      - name: Test - Smoke test backend
        working-directory: ./backend
        run: npm test

      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Normalizar ECR_URL
        run: echo "ECR_URL=$(echo '${{ secrets.ECR_URL }}' | tr '[:upper:]' '[:lower:]' | sed 's:/*$::')" >> $GITHUB_ENV

      - name: Build y Push imagen Backend
        run: |
          docker build -t tienda-backend ./backend
          docker tag tienda-backend:latest $ECR_URL/tienda-backend:${{ github.sha }}
          docker tag tienda-backend:latest $ECR_URL/tienda-backend:latest
          docker push $ECR_URL/tienda-backend:${{ github.sha }}
          docker push $ECR_URL/tienda-backend:latest

  # ─────────────────────────────────────────
  # JOB 3: Deploy en EKS (después de los builds)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy en EKS
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Conectar al clúster EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Normalizar ECR_URL
        run: echo "ECR_URL=$(echo '${{ secrets.ECR_URL }}' | tr '[:upper:]' '[:lower:]' | sed 's:/*$::')" >> $GITHUB_ENV

      - name: Actualizar imagen Frontend en EKS
        run: |
          kubectl set image deployment/tienda-frontend \
            frontend=$ECR_URL/tienda-frontend:${{ github.sha }} \
            -n tienda

      - name: Actualizar imagen Backend en EKS
        run: |
          kubectl set image deployment/tienda-backend \
            backend=$ECR_URL/tienda-backend:${{ github.sha }} \
            -n tienda

      - name: Esperar rollout Frontend
        run: |
          kubectl rollout status deployment/tienda-frontend \
            -n tienda \
            --timeout=600s

      - name: Esperar rollout Backend
        run: |
          kubectl rollout status deployment/tienda-backend \
            -n tienda \
            --timeout=600s

      - name: Verificar pods desplegados
        run: |
          echo "=== PODS ==="
          kubectl get pods -n tienda
          echo ""
          echo "=== SERVICIOS ==="
          kubectl get svc -n tienda
          echo ""
          echo "=== HPA ==="
          kubectl get hpa -n tienda

      - name: Debug - ver imagen del deployment
        run: |
          kubectl describe deployment tienda-frontend -n tienda | grep Image