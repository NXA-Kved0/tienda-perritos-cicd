name: CI/CD Tienda Perritos - EKS Pablo

on:
  push:
    branches:
      - main
      - eft-devops-pabloynaxa

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: tienda-eks
  ECR_REGISTRY: 170098508847.dkr.ecr.us-east-1.amazonaws.com

jobs:
  deploy:
    name: Build, Push y Deploy EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.P_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.P_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.P_AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.P_AWS_REGION }}

      - name: Login en Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Build y Push Frontend
        run: |
          docker build --no-cache -t tienda-frontend ./frontend
          docker tag tienda-frontend:latest $ECR_REGISTRY/tienda-front:${{ github.sha }}
          docker tag tienda-frontend:latest $ECR_REGISTRY/tienda-front:latest
          docker push $ECR_REGISTRY/tienda-front:${{ github.sha }}
          docker push $ECR_REGISTRY/tienda-front:latest

      - name: Build y Push Backend
        run: |
          docker build --no-cache -t tienda-backend ./backend
          docker tag tienda-backend:latest $ECR_REGISTRY/tienda-back:${{ github.sha }}
          docker tag tienda-backend:latest $ECR_REGISTRY/tienda-back:latest
          docker push $ECR_REGISTRY/tienda-back:${{ github.sha }}
          docker push $ECR_REGISTRY/tienda-back:latest

      - name: Build y Push DB
        run: |
          docker build --no-cache -t tienda-db ./db
          docker tag tienda-db:latest $ECR_REGISTRY/tienda-db:${{ github.sha }}
          docker tag tienda-db:latest $ECR_REGISTRY/tienda-db:latest
          docker push $ECR_REGISTRY/tienda-db:${{ github.sha }}
          docker push $ECR_REGISTRY/tienda-db:latest

      - name: Configurar kubectl con EKS
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME

      - name: Actualizar imágenes en EKS
        run: |
          kubectl set image deployment/tienda-frontend tienda-frontend=$ECR_REGISTRY/tienda-front:${{ github.sha }} -n tienda
          kubectl set image deployment/tienda-backend tienda-backend=$ECR_REGISTRY/tienda-back:${{ github.sha }} -n tienda
          kubectl set image deployment/tienda-db tienda-db=$ECR_REGISTRY/tienda-db:${{ github.sha }} -n tienda

      - name: Esperar rollout
        run: |
          kubectl rollout status deployment/tienda-frontend -n tienda --timeout=600s
          kubectl rollout status deployment/tienda-backend -n tienda --timeout=600s
          kubectl rollout status deployment/tienda-db -n tienda --timeout=600s

      - name: Verificar despliegue
        run: |
          kubectl get pods -n tienda
          kubectl get svc -n tienda
          kubectl get hpa -n tienda