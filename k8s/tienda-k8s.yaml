apiVersion: v1
kind: Namespace
metadata:
  name: tienda
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: tienda
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: admin123
  DB_PASSWORD: admin123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tienda-db
  namespace: tienda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tienda-db
  template:
    metadata:
      labels:
        app: tienda-db
    spec:
      containers:
        - name: tienda-db
          image: 170098508847.dkr.ecr.us-east-1.amazonaws.com/tienda-db:latest
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: tienda_perritos
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tienda-db
  namespace: tienda
spec:
  selector:
    app: tienda-db
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tienda-backend
  namespace: tienda
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tienda-backend
  template:
    metadata:
      labels:
        app: tienda-backend
    spec:
      containers:
        - name: tienda-backend
          image: 170098508847.dkr.ecr.us-east-1.amazonaws.com/tienda-back:latest
          ports:
            - containerPort: 3001
          env:
            - name: DB_HOST
              value: tienda-db
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              value: tienda_perritos
            - name: DB_PORT
              value: "3306"
            - name: PORT
              value: "3001"
---
apiVersion: v1
kind: Service
metadata:
  name: tienda-backend
  namespace: tienda
spec:
  selector:
    app: tienda-backend
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tienda-frontend
  namespace: tienda
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tienda-frontend
  template:
    metadata:
      labels:
        app: tienda-frontend
    spec:
      containers:
        - name: tienda-frontend
          image: 170098508847.dkr.ecr.us-east-1.amazonaws.com/tienda-front:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: tienda-frontend
  namespace: tienda
spec:
  selector:
    app: tienda-frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer